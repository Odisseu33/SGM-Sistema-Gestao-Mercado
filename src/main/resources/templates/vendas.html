<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>SGM | Vendas</title><link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"/><link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.css}"/><link rel="stylesheet" th:href="@{/css/style.css}"/></head><body th:replace="~{layout :: shell(~{::main})}"><main><div class="panel"><p class="page-kicker">SGM / OPERAÇÕES</p><h1 class="page-title">Histórico de vendas</h1><p class="page-subtitle">Consulte as operações realizadas.</p><a class="btn btn-primary mb-3" href="/vendas/nova">Registrar venda</a><div class="table-responsive"><table class="table"><tr><th>Código</th><th>Data</th><th>Total</th><th>Pagamento</th><th>Status</th><th></th></tr><tr th:each="v:${vendas}"><td><a th:href="@{/vendas/{id}/confirmacao(id=${v.id})}" th:text="${'#'+v.id}"></a></td><td th:text="${#temporals.format(v.dataVenda,'dd/MM/yyyy HH:mm')}"></td><td th:text="${v.valorTotal}"></td><td th:text="${v.formaPagamento}"></td><td th:text="${v.status}"></td><td><form method="post" onsubmit="return confirm('Cancelar venda e devolver itens ao estoque?')" th:action="@{/vendas/{id}/cancelar(id=${v.id})}" th:if="${v.status.name()=='CONCLUIDA'}"><input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden"/><button class="btn btn-sm btn-outline-danger">Cancelar</button></form></td></tr></table></div></div></main></body></html>
