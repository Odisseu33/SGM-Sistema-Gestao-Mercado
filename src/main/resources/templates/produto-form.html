<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>SGM | Produto Form</title><link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"/><link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.css}"/><link rel="stylesheet" th:href="@{/css/style.css}"/></head><body th:replace="~{layout :: shell(~{::main})}"><main><div class="panel"><p class="page-kicker">SGM / CADASTROS</p><h1 class="page-title">Cadastro de produto</h1><p class="page-subtitle">Preencha as informações do produto.</p><form action="/produtos/salvar" class="row g-3" method="post" th:object="${produto}"><input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden"/><input th:field="*{id}" type="hidden"/><div class="col-md-6"><label>Nome</label><input class="form-control" required="" th:field="*{nome}"/></div><div class="col-md-6"><label>Código de barras</label><input class="form-control" th:field="*{codigoBarras}"/></div><div class="col-md-6"><label>Preço de custo</label><input class="form-control" min="0" required="" step=".01" th:field="*{precoCusto}" type="number"/></div><div class="col-md-6"><label>Preço de venda</label><input class="form-control" min="0" required="" step=".01" th:field="*{precoVenda}" type="number"/></div><div class="col-md-6"><label>Estoque mínimo</label><input class="form-control" min="0" required="" th:field="*{estoqueMinimo}" type="number"/></div><div class="col-md-6"><label>Categoria</label><select class="form-select" name="categoriaId"><option value="">Selecione</option><option th:each="c:${categorias}" th:text="${c.nome}" th:value="${c.id}"></option></select></div><div class="col-md-6"><label>Fornecedor</label><select class="form-select" name="fornecedorId"><option value="">Selecione</option><option th:each="f:${fornecedores}" th:text="${f.nome}" th:value="${f.id}"></option></select></div><div class="col-12"><label>Descrição</label><textarea class="form-control" th:field="*{descricao}"></textarea></div><div class="col-12"><button class="btn btn-primary">Salvar</button><a class="btn btn-secondary" href="/produtos">Voltar</a></div></form></div></main></body></html>
