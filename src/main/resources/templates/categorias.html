<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>SGM | Categorias</title><link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"/><link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.css}"/><link rel="stylesheet" th:href="@{/css/style.css}"/></head><body th:replace="~{layout :: shell(~{::main})}"><main><div class="panel"><p class="page-kicker">SGM / CADASTROS</p><h1 class="page-title">Categorias</h1><p class="page-subtitle">Organize os produtos por categoria.</p><form action="/categorias/salvar" class="row g-2 mb-4" method="post"><input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden"/><input class="form-control col" name="nome" placeholder="Nome da categoria" required=""/><input class="form-control col" name="descricao" placeholder="Descrição"/><button class="btn btn-primary col-auto">Cadastrar</button></form><div class="table-responsive"><table class="table"><tr><th>Nome</th><th>Descrição</th><th>Ativa</th><th></th></tr><tr th:each="c:${categorias}"><td th:text="${c.nome}"></td><td th:text="${c.descricao}"></td><td th:text="${c.ativo}"></td><td><form method="post" th:action="@{/categorias/{id}/alternar(id=${c.id})}"><input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden"/><button class="btn btn-sm btn-outline-secondary">Alternar</button></form></td></tr></table></div></div></main></body></html>
