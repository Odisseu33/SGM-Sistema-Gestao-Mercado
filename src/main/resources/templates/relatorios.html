<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>SGM | Relatorios</title><link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"/><link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.css}"/><link rel="stylesheet" th:href="@{/css/style.css}"/></head><body th:replace="~{layout :: shell(~{::main})}"><main><div class="panel"><p class="page-kicker">SGM / OPERAÇÕES</p><h1 class="page-title">Relatório financeiro</h1><p class="page-subtitle">Resumo dos resultados e vendas concluídas.</p><div class="row g-3"><div class="col-md-4"><div class="metric">Faturamento<strong th:text="${faturamento}"></strong></div></div><div class="col-md-4"><div class="metric">Custo estimado<strong th:text="${custo}"></strong></div></div><div class="col-md-4"><div class="metric">Lucro bruto estimado<strong th:text="${lucro}"></strong></div></div></div><a class="btn btn-outline-primary my-3" href="/relatorios/vendas.csv">Exportar vendas CSV</a><h4>Vendas concluídas</h4><div class="table-responsive"><table class="table"><tr><th>Venda</th><th>Data</th><th>Total</th></tr><tr th:each="v:${vendas}"><td th:text="${v.id}"></td><td th:text="${v.dataVenda}"></td><td th:text="${v.valorTotal}"></td></tr></table></div></div></main></body></html>
