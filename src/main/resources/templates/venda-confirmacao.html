<!doctype html><html lang="pt-br" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SGM | Venda salva</title><link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"><link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.css}"><link rel="stylesheet" th:href="@{/css/style.css}"></head><body th:replace="~{layout :: shell(~{::main})}"><main><div class="panel confirmation-panel"><div class="confirmation-icon"><i class="bi bi-check-lg"></i></div><p class="eyebrow">COMPROVANTE / VENDA</p><h1 class="page-title">Venda registrada</h1><p class="page-subtitle">Confira os detalhes desta operação abaixo.</p><div class="receipt"><div class="receipt-head"><div><span class="receipt-label">NÚMERO DA VENDA</span><strong th:text="${'#'+venda.id}">#1</strong></div><div><span class="receipt-label">DATA E HORA</span><strong th:text="${#temporals.format(venda.dataVenda,'dd/MM/yyyy HH:mm')}">--</strong></div></div><div class="table-responsive"><table class="table receipt-table"><thead><tr><th>Produto</th><th class="text-center">Qtd.</th><th class="text-end">Unitário</th><th class="text-end">Subtotal</th></tr></thead><tbody><tr th:each="item:${venda.itens}"><td th:text="${item.produto.nome}">Produto</td><td class="text-center" th:text="${item.quantidade}">1</td><td class="text-end" th:text="${#numbers.formatCurrency(item.precoUnitario)}">R$ 0,00</td><td class="text-end" th:text="${#numbers.formatCurrency(item.subtotal)}">R$ 0,00</td></tr></tbody></table></div><div class="receipt-summary"><span>Total pago</span><strong th:text="${#numbers.formatCurrency(venda.valorTotal)}">R$ 0,00</strong></div><div class="receipt-payment"><span>Forma de pagamento</span><strong th:text="${venda.formaPagamento}">PIX</strong></div><div th:if="${venda.observacao != null and !#strings.isEmpty(venda.observacao)}" class="receipt-notes"><span>Observações</span><p th:text="${venda.observacao}"></p></div></div><div class="confirmation-actions"><a th:href="@{/vendas/nova}" class="btn btn-primary">Registrar outra venda</a><a th:href="@{/vendas}" class="btn btn-outline-secondary">Ver histórico</a><button type="button" class="btn btn-outline-secondary" onclick="window.print()">Imprimir comprovante</button></div></div></main></body></html>
