<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>SGM | Estoque</title><link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"/><link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.css}"/><link rel="stylesheet" th:href="@{/css/style.css}"/></head><body th:replace="~{layout :: shell(~{::main})}"><main><div class="panel"><p class="page-kicker">SGM / OPERAÇÕES</p><h1 class="page-title">Movimentação de estoque</h1><p class="page-subtitle">Registre entradas, saídas e ajustes de estoque.</p><form action="/estoque/movimentar" class="row g-2 mb-4" method="post"><input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden"/><select class="form-select col" name="produtoId" required=""><option value="">Produto</option><option th:each="p:${produtos}" th:text="${p.nome+' ('+p.quantidadeEstoque+')'}" th:value="${p.id}"></option></select><select class="form-select col" name="tipo"><option th:each="t:${tipos}" th:text="${t}" th:value="${t}"></option></select><input class="form-control col" min="1" name="quantidade" placeholder="Quantidade" required="" type="number"/><select class="form-select col" name="motivo"><option th:each="m:${motivos}" th:text="${m}" th:value="${m}"></option></select><input class="form-control col" name="observacao" placeholder="Observação"/><button class="btn btn-primary col-auto">Registrar</button></form><div class="table-responsive"><table class="table"><tr><th>Data</th><th>Produto</th><th>Tipo</th><th>Qtd.</th><th>Motivo</th><th>Saldo anterior</th><th>Saldo posterior</th></tr><tr th:each="m:${movimentos}"><td th:text="${#temporals.format(m.dataMovimentacao,'dd/MM/yyyy HH:mm')}"></td><td th:text="${m.produto.nome}"></td><td th:text="${m.tipo}"></td><td th:text="${m.quantidade}"></td><td th:text="${m.motivo}"></td><td th:text="${m.saldoAnterior}"></td><td th:text="${m.saldoPosterior}"></td></tr></table></div></div></main></body></html>
