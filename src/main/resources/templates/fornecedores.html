<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>SGM | Fornecedores</title><link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"/><link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.css}"/><link rel="stylesheet" th:href="@{/css/style.css}"/></head><body th:replace="~{layout :: shell(~{::main})}"><main><div class="panel"><p class="page-kicker">SGM / CADASTROS</p><h1 class="page-title">Fornecedores</h1><p class="page-subtitle">Dados dos fornecedores cadastrados.</p><form action="/fornecedores/salvar" class="row g-2 mb-4" method="post"><input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden"/><input class="form-control col" name="nome" placeholder="Nome" required=""/><input class="form-control col" name="cnpj" placeholder="CNPJ"/><input class="form-control col" name="telefone" placeholder="Telefone"/><input class="form-control col" name="email" placeholder="E-mail"/><button class="btn btn-primary col-auto">Cadastrar</button></form><form><input class="form-control mb-3" name="q" placeholder="Pesquisar por nome" th:value="${q}"/></form><div class="table-responsive"><table class="table"><tr><th>Nome</th><th>CNPJ</th><th>Telefone</th><th>E-mail</th><th>Ativo</th></tr><tr th:each="f:${fornecedores}"><td th:text="${f.nome}"></td><td th:text="${f.cnpj}"></td><td th:text="${f.telefone}"></td><td th:text="${f.email}"></td><td th:text="${f.ativo}"></td></tr></table></div></div></main></body></html>
