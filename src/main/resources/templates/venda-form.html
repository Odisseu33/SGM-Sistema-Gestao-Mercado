<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>SGM | Venda Form</title><link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"/><link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.css}"/><link rel="stylesheet" th:href="@{/css/style.css}"/></head><body th:replace="~{layout :: shell(~{::main})}"><main><div class="panel"><p class="page-kicker">SGM / OPERAÇÕES</p><h1 class="page-title">Registrar venda</h1><p class="page-subtitle">Selecione os produtos e finalize a operação.</p><form action="/vendas/salvar" id="form-venda" method="post"><input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden"/><div id="linhas"><div class="row g-2 mb-2 linha"><div class="col-md-8"><select class="form-select" name="produtoId" required=""><option value="">Selecione o produto</option><option th:each="p:${produtos}" th:text="${p.nome+' | R$ '+p.precoVenda+' | estoque '+p.quantidadeEstoque}" th:value="${p.id}"></option></select></div><div class="col-md-3"><input class="form-control" min="1" name="quantidade" required="" type="number" value="1"/></div><div class="col-md-1"><button class="btn btn-outline-danger remover" type="button">×</button></div></div></div><button class="btn btn-outline-secondary mb-3" id="adicionar" type="button">Adicionar produto</button><div class="mb-3"><label>Forma de pagamento</label><select class="form-select" name="formaPagamento"><option th:each="f:${pagamentos}" th:text="${f}" th:value="${f}"></option></select></div><textarea class="form-control mb-3" name="observacao" placeholder="Observações"></textarea><button class="btn btn-primary">Confirmar venda</button><a class="btn btn-secondary" href="/vendas">Cancelar</a></form></div></main></body></html>
