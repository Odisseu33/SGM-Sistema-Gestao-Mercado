<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>SGM | Produtos</title><link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"/><link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.css}"/><link rel="stylesheet" th:href="@{/css/style.css}"/></head><body th:replace="~{layout :: shell(~{::main})}"><main><div class="panel"><p class="page-kicker">SGM / CADASTROS</p><h1 class="page-title">Produtos</h1><p class="page-subtitle">Consulte e mantenha seu catálogo atualizado.</p><form class="d-flex gap-2 my-3"><input class="form-control" name="q" placeholder="Pesquisar produto" th:value="${q}"/><button class="btn btn-outline-primary">Pesquisar</button><a class="btn btn-primary" href="/produtos/novo">Novo produto</a></form><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Produto</th><th>Código</th><th>Categoria</th><th>Fornecedor</th><th>Preço venda</th><th>Estoque</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="p:${produtos}"><td th:text="${p.nome}"></td><td th:text="${p.codigoBarras}"></td><td th:text="${p.categoria?.nome}"></td><td th:text="${p.fornecedor?.nome}"></td><td th:text="${p.precoVenda}"></td><td th:text="${p.quantidadeEstoque}"></td><td th:text="${p.ativo?'Ativo':'Inativo'}"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/produtos/{id}/editar(id=${p.id})}">Editar</a><form class="d-inline" method="post" th:action="@{/produtos/{id}/alternar(id=${p.id})}"><input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden"/><button class="btn btn-sm btn-outline-secondary">Ativar/desativar</button></form></td></tr></tbody></table></div></div></main></body></html>
