spring.application.name=Sistema de Gestao de Mercado
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/mercado-db;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console
spring.thymeleaf.cache=false
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
